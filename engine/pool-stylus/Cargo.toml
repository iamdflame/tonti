[package]
name = "pool-stylus"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Tonti lifelong-income pool ledger on Robinhood Chain: cohorts, members, monthly settlement, claims. Uses actuary-core's tested ledger."

[dependencies]
actuary-core = { path = "../actuary-core" }
alloy-primitives = "1.5.7"
alloy-sol-types = "1.5.7"
stylus-sdk = "0.10.9"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["mini-alloc"]
export-abi = ["stylus-sdk/export-abi"]
mini-alloc = ["stylus-sdk/mini-alloc"]

[dev-dependencies]
stylus-sdk = { version = "0.10.9", features = ["stylus-test"] }
